name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ghcr-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aelise08/parley-hermes-agent

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s tests -v

  ghcr:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build linux/amd64 image
        run: |
          docker build --platform linux/amd64 \
            --tag "$IMAGE:v1" --tag "$IMAGE:sha-${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" .
      - name: Push
        run: |
          docker push "$IMAGE:v1"
          docker push "$IMAGE:sha-${GITHUB_SHA}"
      - name: Publish digest summary
        run: |
          set -euo pipefail
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:sha-${GITHUB_SHA}")
          echo "Published image: $digest" >> "$GITHUB_STEP_SUMMARY"
